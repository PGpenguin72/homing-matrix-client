# 任務：Phase 0 / 0.11 — CI 授權檢查與依賴弱點掃描
#
# ⚠️ 驗證說明：倉庫尚未建立（任務 0.3），本 workflow 無法即時在 GitHub 上驗證執行；
# 檔案先落庫，待 0.3 完成後以第一次 push 驗證（含本檔註解內各版本的 API 查證紀錄）。
#
# 查證基準日 2026-10-31（經 GitHub Releases API 查證之最新版）：
# * actions/checkout          → v7.0.1（官方 Actions；https://api.github.com/repos/actions/checkout/releases/latest）
# * subosito/flutter-action   → v2.23.0（第三方 Action，version pinned；供應鏈審查由人類負責。
#   若不接受第三方 Action，可改為官方 stable 套件包安裝方式，待人工決定）
# * google/osv-scanner        → v2.7.0，linux_amd64 binary（https://api.github.com/repos/google/osv-scanner/releases/latest）
# * Flutter/dart 版本         → 3.47.9 / 3.13.7（與 app 開發環境一致；SDK 版本記錄見 DEPENDENCIES.md §規格基準版本）
name: license-check-and-vulnerability-scan

on:
  push:
    branches: [main]
  pull_request:
  # 手動觸發（第五十二批）：出 APK 供實機驗收用。單次建置約 20 分鐘
  # （Gradle assembleRelease 1188.8s）→ 不隨每次 push 自動跑，改由人按需啟動。
  workflow_dispatch:

# 同時只跑一次（避免重複建置互相搶資源）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-test-license:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test（不含需網路的整合測試）
        run: >-
          flutter test
          test/homeserver_url_test.dart
          test/auth_test.dart
          test/connect_screen_widget_test.dart
          test/login_screen_widget_test.dart
          test/add_friend_screen_widget_test.dart
          test/block_user_screen_widget_test.dart
          test/device_verification_widget_test.dart
          test/device_management_screen_widget_test.dart
          test/message_filter_test.dart
          test/message_search_screen_widget_test.dart
          test/media_attach_screen_widget_test.dart
          test/report_user_screen_widget_test.dart
          test/crypto_bridge_unit_test.dart
          test/group_chat_manage_screen_widget_test.dart
          test/group_encrypted_screen_widget_test.dart
          test/ui_smoke_test.dart
          test/multi_device_login_screen_widget_test.dart
          test/push_permission_screen_widget_test.dart
          test/rooms_chat_screens_widget_test.dart
          test/widget_test.dart
          test/batch35_features_test.dart
          test/missing_key_repair_test.dart
          test/chat_screen_missing_key_test.dart
          test/engine_init_test.dart
          test/announcement_banner_test.dart
          test/profile_screen_widget_test.dart
          test/sticker_group_test.dart
          test/search_filters_test.dart
          test/message_batch_ops_test.dart
          test/contrast_test.dart
          test/media_upload_engine_init_test.dart
          test/sticker_export_restriction_test.dart
          test/redaction_live_update_test.dart
          test/optimistic_send_test.dart
          test/local_edit_applied_test.dart
          test/chat_row_plan_test.dart
          test/app_strings_test.dart
          test/media_cache_test.dart
          test/app_icons_test.dart
          test/scheduled_messages_test.dart
          test/silent_redaction_test.dart
      - name: license check（直接依賴須記錄於 DEPENDENCIES.md）
        run: python3 ci/license_check.py
      - name: 對比度量測（WCAG 2.1；工具輸出與退出碼）
        # 退出碼 1＝有配色組合未達 AA（4.5:1）→ CI 失敗，逼出無障礙退化。
        # ⚠️ 目前實測有 4 組未達 AA（次要文字 on 白底、緊急紅上的白字等），
        #    故此步驟先以 `continue-on-error: true` 執行並**如實輸出報告**，
        #    待人類決策配色後再改為阻斷式（藍圖 §十四待決事項）。
        continue-on-error: true
        run: dart run tool/check_contrast.dart

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 下載 osv-scanner（版本鎖定 ＋ SHA256 校驗，見檔首查證紀錄）
        # SHA256 取自 GitHub Releases API 的 asset `digest` 欄位
        # （https://api.github.com/repos/google/osv-scanner/releases/tags/v2.7.0
        #  → osv-scanner_linux_amd64 → sha256:160c6253…e4218b），
        # 2026-11-16 本機實測下載值與該 digest **一致**（已交叉比對）。
        # 目的：防止 release 資產被替換（供應鏈攻擊）——只鎖版本不夠，
        # 必須同時鎖雜湊。
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
            && echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict - \
            && chmod +x osv-scanner
      - name: 掃描 pubspec.lock（osv）
        run: ./osv-scanner --lockfile app/pubspec.lock

  # 第五十二批（人類 2026-11-16 指示「是」）：在 CI 建置 APK 供實機驗收。
  # 背景：本機不可編譯（人類指示），且第五十一批的「圖片／附件上傳」與
  # 「FCM 冷喚醒」兩項修復**必須重新建置 APK 才能實機複驗** → 由 CI 出包。
  # ⚠️ 簽章：release 走 `signingConfigs.debug`（見 app/android/app/build.gradle.kts
  # 的 TODO 註解）→ **僅供內部實機測試**，不可用於上架。
  build-apk:
    # 僅在**手動觸發**時建置（單次約 20 分鐘；避免每次 push 都浪費 runner 時間）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 設定 JDK 17（Android Gradle Plugin 需求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run subosito/flutter-action@v2.23.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: 釋出磁碟空間（runner 初始僅剩 ~67MB；NDK29+cargo 需空間）
        # 第九十四批：實測 build 在 ':flutter_vodozemac:cargokitCargoBuild'
        # 因 'No space left on device (os error 28)' 失敗。
        # 清掉 GitHub runner 預裝但本專案用不到的工具鏈（官方建議），
        # 可騰出約 5GB；保留 Flutter / JDK / Android SDK / pub-cache。
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /root/.cache /home/runner/.cache/pip /home/runner/.npm || true
          df -h / | tail -1
      - name: flutter pub get
        run: flutter pub get
      - name: 接受 Android SDK licenses（whisper_ggml 需 NDK 29）
        # 第九十四批：CI 實測 LicenceNotAcceptedException（NDK 29.0.13113456）
        # → runner 的 SDK license 未接受 → 程式/超時皆非原因。
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "Android SDK licenses accepted (SDK=$SDK)"
      - name: 建置 release APK（versionCode 由 pubspec.yaml 控制）
        # FCM 憑證來源二選一：
        # ① 倉庫 secrets（建議；**不進版控**）：FCM_PROJECT_ID／FCM_API_KEY／
        #    FCM_APP_ID／FCM_SENDER_ID —— 四項齊全時 APK 會啟用 FCM 通道；
        #    未設定時為空字串 → App 視為未提供 → 不啟用 FCM（**不崩潰**）。
        # ② `android/app/google-services.json`（**勿提交**；CI 不會有）。
        # ⚠️ 舊版 Google FCM 端點已停用（第五十二批實測 HTTP 404）→ 即使 FCM
        #    通道啟用，經該端點的推播**仍送不到**；需指定可用的閘道：
        #    `--dart-define=FCM_GATEWAY_URL=https://<轉送端>`。
        env:
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
          FCM_GATEWAY_URL: ${{ secrets.FCM_GATEWAY_URL }}
        run: |
          flutter build apk --release \
            --dart-define=FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            --dart-define=FCM_API_KEY="$FCM_API_KEY" \
            --dart-define=FCM_APP_ID="$FCM_APP_ID" \
            --dart-define=FCM_SENDER_ID="$FCM_SENDER_ID" \
            --dart-define=FCM_GATEWAY_URL="$FCM_GATEWAY_URL"
      - name: 上傳 APK 產物
        uses: actions/upload-artifact@v4
        with:
          name: homing-apk-debug-signed
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
